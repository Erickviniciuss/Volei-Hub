<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Times | Vôlei Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
  </head>
  <body class="app-loading" data-theme="dark">
    <main class="page-shell generator-shell">
      <div class="table-top-actions"><img class="table-logo" data-theme-logo src="assets/logo_escuro.png" alt="Vôlei Hub" /><button class="theme-button" type="button" data-theme-toggle aria-pressed="true">☀</button></div>
      <section class="hero">
        <p class="eyebrow">SORTEIO DE EQUIPES</p>
        <h1>Gerador de Times</h1>
        <p class="hero-text">Informe os participantes, configure o tamanho das equipes e faça um sorteio equilibrado.</p>
      </section>

      <section class="setup-card" aria-label="Configuração do sorteio">
        <div class="field-row">
          <div class="field-group compact-field"><label for="people-count">Quantidade de pessoas</label><input id="people-count" type="number" min="1" value="10" /></div>
          <div class="field-group compact-field"><label for="people-per-team">Pessoas por time</label><input id="people-per-team" type="number" min="1" value="4" /></div>
          <div class="field-group compact-field"><label for="team-total">Quantidade de times</label><input id="team-total" type="number" min="1" value="3" /></div>
        </div>
        <p id="ideal-team-count" class="generator-ideal" aria-live="polite"></p>
        <div class="generator-seed-settings">
          <label class="switch-label" for="seed-enabled"><input id="seed-enabled" type="checkbox" /><span><strong>Usar cabeça de chave</strong><small>Os participantes marcados serão distribuídos primeiro entre os times.</small></span></label>
          <div id="seed-count-field" class="field-group compact-field" hidden><label for="seeds-per-team">Cabeças de chave por time</label><select id="seeds-per-team"><option value="1" selected>1 por time</option><option value="2">2 por time</option><option value="3">3 por time</option></select></div>
        </div>
        <div class="names-toggle-row"><p>Informe os nomes dos participantes e, se desejar, marque os cabeças de chave.</p></div>
        <div id="people-names" class="team-names generator-people"></div>
        <p id="generator-message" class="auth-message" aria-live="polite"></p>
        <button id="draw-teams" type="button">Sortear times</button>
      </section>

      <section id="generated-teams" class="generated-teams" hidden aria-live="polite"></section>
      <a class="home-button" href="index.html"><span aria-hidden="true"><img src="assets/casa.png" alt="" /></span> Voltar para o menu principal</a>
    </main>
    <footer class="site-footer">© 2026 RST Code. Todos os direitos reservados.</footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="theme.js"></script><script src="table-auth.js"></script><script src="game-storage.js?v=3"></script><script src="gerador-times.js?v=4"></script>
  </body>
</html>
